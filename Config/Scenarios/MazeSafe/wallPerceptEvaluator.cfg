// Simulation only: scores the real wall perceptor against the true maze (see Src/Modules/Perception/WallPerceptEvaluator).
// The maze and its pose on the field are those of oracledMazePerceptsProvider.cfg, the ranges those of wallPerceptor.cfg.
mazeFile = "Config/Scenes/Includes/Maze/current.maze";
mazePoseOnField = {rotation = 180deg; translation = {x = 2000; y = 2000;};};
lookAheadRangeWalking = 2;
lookAheadRangeStanding = 3;
// Time between two summaries in ms.
summaryIntervalMs = 15000;
// Taps the head front once this long (ms) after the game state became playing, to start the exploration; 0 never. A `dr` line in
// the scene is consumed before the maze behaviour is ready, so the evaluator does it.
startTapAfterMs = 3000;
// Taps again every this long (ms) after the first tap, 0 only once: the tap at the goal starts the return, the one at the start the speed run.
tapRepeatMs = 20000;
