// Simulation only: fake maze percepts from the ground truth robot pose (see OracledMazePerceptsProvider.h).
// The maze, relative to the repository root. maze_to_scene.py writes it next to the scene it generates.
mazeFile = "Config/Scenes/Includes/Maze/current.maze";
// Pose of the maze frame (origin in its south-west corner, x east, y north) in the frame of the ground
// truth robot pose. maze_to_scene.py centres the 4 m maze on the simulator origin, but SimRobot rotates
// the ground truth of first-team robots (robot1, the maze robot) by 180deg, hence 180deg and (2000, 2000).
// A second-team robot would need rotation = 0deg and translation = {x = -2000; y = -2000;}.
mazePoseOnField = {rotation = 180deg; translation = {x = 2000; y = 2000;};};
// Cells ahead of the robot's cell that are seen.
maxRange = 2;
// Probability to miss one observation. 1 gives empty percepts.
dropoutRate = 0;
tagPositionStdDev = 5;       // mm per axis
tagRotationStdDev = 1deg;    // per axis
wallDistanceStdDev = 10;     // mm
// Largest angle between the tag normal and the direction to the camera.
maxTagViewAngle = 70deg;
