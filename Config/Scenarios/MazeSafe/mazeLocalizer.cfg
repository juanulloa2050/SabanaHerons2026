// Pose in the maze frame (mm, x east, y north, origin at the outer bottom-left corner, rotation
// counterclockwise from east) and in cells. See Src/Modules/Modeling/MazeLocalizer/MazeLocalizer.h.

// Start: until MZ-041 (start deduction) and MZ-024 (`start.cell`) exist the robot is positioned at the
// start on the first frame and on every transition into playing. The defaults match the maze that the
// generator and the scene use: the start is cell 0 (top-left corner) and the only open side of the start
// cell is south (see Config/Scenes/Includes/Maze/current.maze). Other start corners: 7, 56, 63.
// MZ-024 replaces these two values.
startCell = 0;
startHeading = south;      // north, east, south or west

// Heading source. true: the gyro yaw of the torso (re-aligned by square-on tags); false: odometry rotation.
useGyro = true;

// Tag fix (Src/Tools/Maze/MazeLocalization.h).
maxFaceAngleError = 45deg;   // Largest angle between the measured and the expected tag normal.
translationGain = 0.5;       // Share of the position error that a fix corrects at zero distance.
farDistance = 2000;          // mm; at this tag distance the gain is scaled by farGainScale.
farGainScale = 0.4;
rotationGain = 0.5;          // Share of the heading error that a square-on fix corrects.
squareOnAngle = 25deg;       // Largest angle between the camera ray and the tag normal for that correction.

// Quality (RobotPose::quality, read by MZ-025): superb up to superbMax*, okay up to okayMax*, else poor,
// measured since the last tag fix.
superbMaxTime = 10000;       // ms
superbMaxDistance = 1500;    // mm
okayMaxTime = 30000;         // ms
okayMaxDistance = 4000;      // mm

// Simulation-only test knobs: SimRobot has neither gyro drift nor odometry noise. Leave all at 0 on the robot.
injectedGyroDriftPerMinute = 0;          // deg/min added to the gyro yaw.
injectedOdometryTranslationNoise = 0;    // Std. dev. of the relative error of each odometry translation delta, e.g. 0.05.
injectedOdometryRotationNoise = 0deg;    // Std. dev. of the rotation error per metre walked (only matters with useGyro = false).
