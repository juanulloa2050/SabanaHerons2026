// Parameters of the AprilTag detector (see Src/Modules/Perception/AprilTagDetector/AprilTagDetector.h).
// The tag size comes from mazeTagLayout.cfg.
// Detections with a smaller decision margin are dropped. Good tags score far above 50.
minDecisionMargin = 30;
// Detections with more corrected bits are dropped; 0 accepts only exact decodes.
maxHamming = 0;
// Largest relative difference between the distance from the estimated pose and the distance that the
// longest edge of the tag implies (a slanted tag has a shorter apparent size than a frontal one).
sizeTolerance = 0.5;
// Run on every n-th image only; 1 runs on every image. Raise it if the stopwatch "AprilTagDetector" exceeds 20 ms.
frameSkip = 1;
// Tags farther away than this are dropped (mm). The maze is read at 250..1500 mm.
maxDistance = 3000;
// The maze uses the ids 0..63 (row * 8 + column); larger ids are false positives.
maxId = 63;
// Downscale factor of the quad detection: faster, but small tags are lost.
quadDecimate = 2;
