// Settings of the maze behaviour (Src/Modules/BehaviorControl/SkillBehaviorControl/Options/HandleMaze.h). MazeMapper reads `start`
// and SkillBehaviorControl reads `announce`; each reader ignores the entries it does not know.

// Where the robot starts (the start is a corner with walls on three sides and the robot faces the open side).
// cell:    -1 deduces the corner from the AprilTags and the walls it sees; 0, 7, 56 or 63 gives it. Any other value is an
//          error when the module loads and is treated as -1.
// heading: the maze heading the robot faces at the start: north, east, south or west. A corner has two open sides, so it
//          is needed when `cell` is given and ignored when it is -1. It must point into the maze (cell 0: east or south;
//          7: south or west; 56: north or east; 63: north or west), otherwise it is an error and `cell` is treated as -1.
// A tag or a wall that contradicts a given start is reported with a warning; the given start does not change.
start = {
  cell = -1;
  heading = south;
};

// Whether the robot says what it is doing out loud ("ready", "exploring", "speed run", "goal", "standby", "finished", "start <id>",
// and the answers to the head gestures). false silences all of it; the behaviour itself does not change.
announce = {
  enabled = true;
};
