strategy = s4v4_scaled;
// Embedded obs47 role-conditioned defender (RL/ppo_defender_hsl2026). Enabled here as the
// SimRobot/NAO test scenario. dynamicPlayBall is false because the defender is an off-ball
// role: with players=[] every field player (goalkeeper auto-excluded) runs the defender policy.
// Restrict to specific robots with embeddedPPOPlayers, e.g. [3] or [3, 4].
// NOTE: LOADS_PARAMETERS aborts on the robot (FAIL) if any key below is missing.
enableEmbeddedPPO = true;
embeddedPPOModelPath = "Config/NeuralNets/RLPolicy/ppo_defender_hsl2026.onnx";
embeddedPPOStrikerModelPath = "Config/NeuralNets/RLPolicy/ppo_striker_hsl2026.onnx";
embeddedPPORole = "defender";
embeddedPPODefenderModelPath = "Config/NeuralNets/RLPolicy/ppo_defender_hsl2026.onnx";
// Team striker (v4.2) / merged brain (v5) disabled in this baseline scenario.
embeddedPPOTeamStrikerModelPath = "";
embeddedPPOMergedTeamModelPath = "";
embeddedPPOTeamNumber = -1;
embeddedPPODynamicPlayBall = false;
embeddedPPOPlayers = [];
embeddedPPODefenderPlayers = [];
embeddedPPOStandWatchdogMs = 0;
embeddedPPOStandWatchdogCooldownMs = 3000;
embeddedPPOStandWatchdogForceWalk = false;
