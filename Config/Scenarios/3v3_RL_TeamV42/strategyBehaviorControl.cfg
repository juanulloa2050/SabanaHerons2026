strategy = s3v3_full;
// Team striker v4.2 (doc-37 transplant): 47-dim obs, role-conditioned policy.
// The playBall robot (closest to ball by B-Human strategy) runs the v4.2 ONNX;
// all other field robots use B-Human strategy.
//
// Contract:
//   - obs[44]=1 (is_striker), obs[45:47]=0: striker-only deploy, force is_striker.
//   - Gate thresholds: shoot_open enter=0.30 / exit=0.20 (v4.2 training contract).
//   - Active skills: stand, walk, shoot, pass, dribble (block/mark/observe forbidden).
//   - Pass: armed when finishArmed AND forward outlet exists AND shot_opening < 0.55.
//   - See Config/NeuralNets/RLPolicy/ppo_team_hsl2026_v4_2.json and doc-37.
enableEmbeddedPPO = true;
embeddedPPOTeamNumber = -1;
embeddedPPODynamicPlayBall = true;
embeddedPPOTeamStrikerModelPath = "Config/NeuralNets/RLPolicy/ppo_team_hsl2026_v4_2.onnx";
embeddedPPODefenderPlayers = [];
embeddedPPOStandWatchdogMs = 3000;
embeddedPPOStandWatchdogCooldownMs = 3000;
embeddedPPOStandWatchdogForceWalk = true;
