// Simulation only: starts and measures the maze attempts from the ground truth (see Src/Modules/Modeling/MazeRunMetricsProvider).
// Switched on by `for Cognition mr MazeRunMetrics MazeRunMetricsProvider` in the scene console; Util/MazeTools/run_sim_campaign.py
// writes this file for every run. The metrics go to the standard error stream as "MZ021_METRICS {...}" and "MZ021_DONE".
// The maze, relative to the repository root; the same as in oracledMazePerceptsProvider.cfg.
mazeFile = "Config/Scenes/Includes/Maze/current.maze";
// Pose of the maze frame in the frame of the ground truth robot pose; the same as in oracledMazePerceptsProvider.cfg.
mazePoseOnField = {rotation = 180deg; translation = {x = 2000; y = 2000;};};
// Attempts to run, 1 or 2. Attempt 2 needs returnToStart.enabled = true and trigger = timer in handleMaze.cfg: the robot walks
// back to the start on its own and the module taps again when it stands there. The competition places the robot by hand instead.
attempts = 1;
// Taps the head front once this long (ms) after the game state became playing, to start attempt 1; 0 never taps and measures nothing,
// so the module is harmless in a normal Maze run. A `dr` line in the scene is consumed before the maze behaviour is ready.
startTapAfterMs = 0;
// An attempt that has not reached a goal cell this long (ms, simulated time) after its tap is over (reached_goal false).
attemptTimeoutMs = 300000;
// Longest wait (ms) between the goal of attempt 1 and the robot standing at the start. Beyond it attempt 2 is reported as not_started.
// It has to cover returnToStart.delayMs + returnToStart.maxDurationMs of handleMaze.cfg.
returnTimeoutMs = 150000;
// The robot has to stand still this long (ms) inside the start cell before the tap of attempt 2.
settleMs = 3000;
// Wall contact (a proxy, not an ODE contact): the robot is in contact while the distance from its centre to the centre line of a
// wall is below contactRadius (mm), and out of it above contactRadius + hysteresis. Each entry counts once.
contactRadius = 150;
hysteresis = 20;
// Max stall: the longest interval in which the robot moved less than stallDistance (mm) and turned less than stallAngle from an
// anchor pose that is replaced whenever one of them is exceeded. Standing wall scans count.
stallDistance = 50;
stallAngle = 15deg;
