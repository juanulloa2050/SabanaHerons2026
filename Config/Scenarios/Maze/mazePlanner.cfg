// Durations of the primitive motions that the maze planner uses (Src/Tools/Maze/MazePlanner.h, MazeCosts).
// They are priors; MZ-028 replaces them with the means measured in Lab 2.
// The tickets call them t_fwd, t_start, t_turn90 and t_turn180. All values are in milliseconds.
forwardMs = 2500;   // One cell forward while already walking.
startMs = 800;      // Extra time for the first step after standing (after a turn or at the start).
turn90Ms = 2000;    // A 90 degree turn in place.
turn180Ms = 3500;   // A 180 degree turn in place.
