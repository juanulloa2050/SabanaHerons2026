// Which wall faces carry an AprilTag (see Src/Tools/Maze/MazeTagLayout.h).
// mode = allFaces: a tag on every wall face of every cell.
// mode = faces:    a tag only on the faces listed in `faces`, e.g. faces = [east];
// mode = walls:    a tag only on the listed pairs, e.g. walls = [{cell = 10; face = east;}, {cell = 11; face = north;}];
// A face never carries a tag where the maze has no wall. Faces are absolute (maze frame).
// The tag id of a cell is its index (row * 8 + column).
mode = allFaces;
faces = [north, east, south, west];
walls = [];
centreHeight = 300; // mm above the floor
size = 150;         // mm, edge of the black outer square
