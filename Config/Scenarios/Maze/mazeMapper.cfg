// The believed wall map of the maze. See Src/Modules/Modeling/MazeMapper/MazeMapper.h.

// Cell the attempts start in; same value as startCell of mazeLocalizer.cfg. MZ-024 (`start.cell`) replaces it.
startCell = 0;

// Evidence per edge (Src/Tools/Maze/MazeMapFusion.h): an edge leaves `unknown` after `threshold` consistent
// observations of full weight, and flipping a decided edge needs the same amount of contrary evidence.
threshold = 3;
fullWeightDistance = 500;    // mm; wall observations up to this distance have full weight ...
zeroWeightDistance = 2500;   // mm; ... and none from this distance on, linear in between.
tagWeight = 1;               // A decoded tag is a wall at any distance.

// Keep equal to maxFaceAngleError of mazeLocalizer.cfg: tags the localizer rejects are not used for the map either.
maxFaceAngleError = 45deg;

// The map only learns while the localizer quality is at least this good (superb, okay, poor).
// poor accepts every observation.
worstAcceptedQuality = poor;
