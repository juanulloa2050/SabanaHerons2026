// Parameters of the wall perceptor (see Src/Modules/Perception/WallPerceptor/WallPerceptor.h, Src/Tools/Maze/MazeWallScan.h
// and Src/Tools/Maze/MazeWallView.h). Starting values, to be set from the simulation evaluation (MZ-019 T3).

// Boundary scan.
// Distance between the scanned columns in pixels.
columnStep = 8;
// The boundary has no fixed polarity: a brightness step in either direction counts (walls are lighter than the floor by
// the rules but darker in the simulator).
// Rows averaged on each side of a candidate boundary.
smoothRows = 3;
// Columns on each side of the scanned one that are averaged.
columnHalfWidth = 1;
// Least brightness step of the floor-to-wall boundary in grey levels (the minimum wall/floor contrast).
minGradient = 12;
// The bottom rows of a column and the rows below a boundary have to look like the floor: at most this many grey levels from
// the floor reference. A column with wall at its bottom has no boundary (the edges of an AprilTag are no boundary).
maxFloorDeviation = 30;
// Least brightness of the wall above the floor reference in grey levels; rejects the far edge of the goal patch.
minWallContrast = 8;
// Height in mm up to which a column has to stay wall: near the camera height, below the wall top (600 mm).
minWallCheckHeightMm = 550;
// Part of the rows up to that height that must not look like floor (a tag counts as wall), and the longest run of
// floor-like rows allowed (floor behind a goal patch or a marking shows as such a run).
minWallRowFraction = 0.75;
maxFloorRunRows = 4;
// Rows that have to remain for the check when the check height is above the top of the image.
minCheckRows = 3;
// Bottom image rows that give the floor reference.
floorReferenceRows = 8;
// The goal is marked by a floor colour, walls and floor have none: a step whose region above is more saturated than the floor
// (levels of the ECImage saturated channel) by more than this is a floor marking, not a wall; 0 switches the veto off. Measured in
// simulation: goal patch 51, wall 0, floor 0 (camera noise on a real grey is about 10).
maxWallSaturation = 25;
// Floor farther than this from the camera is not searched (mm); sets the horizon row.
maxScanDistanceMm = 3500;
// A column without a boundary is free floor only if its bottom rows are this close (grey levels) to the learned floor
// brightness; otherwise a near wall fills the column.
floorTolerance = 8;
// Part of the difference to a new floor reference that the learned floor follows per image with enough boundaries.
floorTrackingRate = 0.1;
// The learned floor is forgotten after this time (ms) without such an image; it is also reset when the robot becomes active.
floorMaxAgeMs = 10000;

// Grid snap.
// Largest distance of a point to the grid line it is snapped to (mm). 150: the standing error is 24 mm (p95) up to 2.5 m and the
// walking error 95 mm up to 1.5 m, and a point 250 mm from a line cannot be told from its neighbour anyway.
snapToleranceMm = 150;
// Points needed for a wall.
minSupportPoints = 3;
// How much farther than an edge the floor has to be visible for an open edge (mm).
openClearanceMm = 150;
// Points closer than this to a grid vertex are ignored (mm); keeps 50 mm of noise from crediting a neighbour edge.
vertexMarginMm = 60;
// By the rules the cells of the goal block have no walls between them: those edges are never reported as walls.
noGoalBlockWalls = true;

// Cells ahead of the robot's cell that are reported. From the simulation evaluation (MZ-019 T3): walking, the distance error
// is 18 / 45 mm (mean / p95) at 1.0 m and 35 / 90 mm at 1.5 m but 100 / 250 mm and more at 2.0 m, beyond the snap tolerance,
// so only the next cell is reported; standing it stays under 13 / 24 mm up to 2.5 m, so 3 cells.
lookAheadRangeWalking = 1;
lookAheadRangeStanding = 3;
