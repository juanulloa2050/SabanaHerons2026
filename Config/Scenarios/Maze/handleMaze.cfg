// Settings of the maze behaviour (Src/Modules/BehaviorControl/SkillBehaviorControl/Options/HandleMaze.h). MazeMapper reads `start`
// and SkillBehaviorControl reads `announce`, `returnToStart` and `blockedWalk`; each reader ignores the entries it does not know.

// Where the robot starts (the start is a corner with walls on three sides and the robot faces the open side).
// cell:    -1 deduces the corner from the AprilTags and the walls it sees; 0, 7, 56 or 63 gives it. Any other value is an
//          error when the module loads and is treated as -1.
// heading: the maze heading the robot faces at the start: north, east, south or west. A corner has two open sides, so it
//          is needed when `cell` is given and ignored when it is -1. It must point into the maze (cell 0: east or south;
//          7: south or west; 56: north or east; 63: north or west), otherwise it is an error and `cell` is treated as -1.
// A tag or a wall that contradicts a given start is reported with a warning; the given start does not change.
start = {
  cell = -1;
  heading = south;
};

// Whether the robot says what it is doing out loud ("ready", "exploring", "speed run", "goal", "standby", "finished", "start <id>",
// and the answers to the head gestures). false silences all of it; the behaviour itself does not change.
announce = {
  enabled = true;
};

// Return to the start after the goal (MZ-024.1): walk back to the start cell while still exploring (unknown edges are tried), so that
// the edges seen on the way are in the map for attempt 2. The return never changes the attempt counter.
// enabled:       false: the robot stands at the goal ("goal", "finished"), as without the return. true: it says "goal" only and
//                starts the return with the trigger below, saying "returning".
// trigger:       timer: start delayMs after the goal is confirmed. button: start on a single headFront tap while standing at the goal
//                (in SimRobot: dr option:HandleMaze:headFront on).
// delayMs:       wait after the goal for trigger = timer.
// maxDurationMs: time limit of the return, counted from "returning". The return ends at the start cell, at the limit (also if no
//                route to the start is found), or when the robot is picked up; then it stands in standby ("standby"). A headFront
//                tap at the start then runs the speed run as usual.
returnToStart = {
  enabled = true;
  trigger = button;
  delayMs = 5000;
  maxDurationMs = 120000;
};

// Blocked walk detection (MZ-046): a forward walk into a wall the map did not know is stopped, the robot steps back to the centre of the cell
// it started in, and the edge becomes a wall that no wall percept can open again. The values are the ones measured in SimRobot (maze_19):
// the gyroscope (yaw rate) deviation over 250 ms is 0.06..0.19 rad/s walking free and 1 rad/s and more when pushing against a panel.
// RECALIBRATE gyroStdThreshold and bumperHoldMs on the robot: the real gait and the real panel give other levels, and the foot bumpers do
// not exist in SimRobot (the gyroscope signal may also be an artefact of the simulated contact).
// gyroWindowMs:      window of the deviation of the yaw rate (ms).
// gyroStdThreshold:  deviation (rad/s) above which a commanded forward walk looks blocked.
// minWalkSpeed:      a walk slower than this (commanded, mm/s) cannot be blocked, so a standing robot never triggers.
// blockedTimeoutMs:  how long the gyroscope alarm has to hold without a gap (ms); the jolts of the start and stop of a walk last ~120 ms.
// bumperHoldMs:      how long a foot bumper contact during a forward walk has to hold (ms).
// walkGapMs:         how long the commanded speed may stay under minWalkSpeed without dropping the gyroscope alarm (ms); it dips to 80..90 mm/s for
//                    up to ~300 ms now and then, also while the robot pushes against a panel.
blockedWalk = {
  gyroWindowMs = 250;
  gyroStdThreshold = 0.5;
  minWalkSpeed = 100;
  blockedTimeoutMs = 1000;
  bumperHoldMs = 100;
  walkGapMs = 400;
};
