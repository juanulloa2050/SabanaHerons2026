strategy = s3v3_full;
// Merged brain v5 (doc-38 transplant): all 3 field players use the same 47-dim
// role-conditioned ONNX. A distributed role coordinator (assign_roles port) elects
// striker/open_support/off_ball_support each frame and writes obs[44:47].
//
// Contract:
//   - All field robots (non-GK) run the merged brain; GK excluded by default.
//   - Role is elected by local coordinator running on each robot with shared TeamData.
//   - Gate thresholds: shoot_open enter=0.30 / exit=0.20 (inherited from v4.2).
//   - Active skills: stand, walk, shoot, pass, dribble, block, mark.
//   - Support/defender WALK uses EMA coordination target anchor (not ball anchor).
//   - Block-priority wrapper: if off_ball + argmax==mark + block armed + ball_front<opp_front → block.
//   - See Config/NeuralNets/RLPolicy/ppo_team_hsl2026_v5_merged.json and doc-38.
enableEmbeddedPPO = true;
embeddedPPOTeamNumber = -1;
embeddedPPOMergedTeamModelPath = "Config/NeuralNets/RLPolicy/ppo_team_hsl2026_v5_merged.onnx";
embeddedPPODefenderPlayers = [];
embeddedPPOStandWatchdogMs = 3000;
embeddedPPOStandWatchdogCooldownMs = 3000;
embeddedPPOStandWatchdogForceWalk = true;
